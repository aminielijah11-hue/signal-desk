[project]
name = "signal-desk"
version = "0.1.0"
description = "Signal Desk — disclosure & flow intelligence platform (ingest/scoring/research/alerting)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "coverage>=7.6",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ingest", "scoring", "research", "alerting"]
exclude = "tests/"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ingest", "scoring", "research", "alerting"]
