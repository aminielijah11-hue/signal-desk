name: guardrails

on:
  push:
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install Python deps
        working-directory: py
        run: uv sync

      - name: Install Node deps
        working-directory: app
        run: npm ci

      - name: Lint (ruff, black, eslint)
        run: make lint

      - name: Typecheck (mypy --strict, tsc)
        run: make typecheck

      - name: Test (pytest)
        run: make test

      - name: Guardrails (§0.A.4 — blocking)
        run: make guardrails
