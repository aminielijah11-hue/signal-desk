name: guardrails

on:
  push:
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signal_desk
          POSTGRES_PASSWORD: signal_desk_ci
          POSTGRES_DB: signal_desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signal_desk -d signal_desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://signal_desk:signal_desk_ci@localhost:5432/signal_desk
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install Python deps
        working-directory: py
        run: uv sync

      - name: Install Node deps
        working-directory: app
        run: npm ci

      - name: Apply migrations (CI-local throwaway Postgres, not Neon)
        run: make db.migrate

      - name: Lint (ruff, black, eslint)
        run: make lint

      - name: Typecheck (mypy --strict, tsc)
        run: make typecheck

      - name: Test (pytest)
        run: make test

      - name: Guardrails (§0.A.4 — blocking)
        run: make guardrails
